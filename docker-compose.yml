services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: opendxp
      POSTGRES_USER: opendxp
      POSTGRES_PASSWORD: opendxp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    ports:
      - "18081:18081"
      - "18082:18082"
      - "19092:19092"
      - "19644:9644"

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8090:8080"
    depends_on:
      - redpanda

  api:
    build:
      context: .
      dockerfile: src/OpenDXP.Api/Dockerfile
      target: dev
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Database=opendxp;Username=opendxp;Password=opendxp"
      ConnectionStrings__Redis: "redis:6379"
      Kafka__BootstrapServers: "redpanda:9092"
    volumes:
      - .:/src
    depends_on:
      - postgres
      - redis
      - redpanda

  admin:
    build:
      context: client/admin
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./client/admin:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres-data:
