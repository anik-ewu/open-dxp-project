services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opendxp
      POSTGRES_USER: opendxp
      POSTGRES_PASSWORD: opendxp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: src/OpenDXP.Api/Dockerfile
      target: dev
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Database=opendxp;Username=opendxp;Password=opendxp"
      ConnectionStrings__Redis: "redis:6379"
    volumes:
      - .:/src
    depends_on:
      - postgres
      - redis

  admin:
    build:
      context: client/admin
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./client/admin:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres-data:
