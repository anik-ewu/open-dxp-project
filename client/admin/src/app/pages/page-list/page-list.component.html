<div>
  <header class="mb-6 flex items-center justify-between">
    <h2 class="text-2xl font-semibold text-slate-900">Pages</h2>
    <a routerLink="/pages/new" class="btn-primary">+ New page</a>
  </header>

  @if (loading) {
    <div class="card text-center text-sm text-slate-500">Loading...</div>
  } @else if (pages.length === 0) {
    <div class="card text-center text-sm text-slate-500">No pages yet.</div>
  } @else {
    <div class="overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm">
      <table class="min-w-full divide-y divide-slate-200">
        <thead class="bg-slate-50">
          <tr>
            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Title</th>
            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Slug</th>
            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Status</th>
            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Updated</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          @for (page of pages; track page.id) {
            <tr class="hover:bg-slate-50">
              <td class="px-4 py-3 text-sm">
                <a [routerLink]="['/pages', page.id]" class="font-medium text-indigo-600 hover:text-indigo-500">{{ page.title }}</a>
              </td>
              <td class="px-4 py-3 text-sm text-slate-500">{{ page.slug }}</td>
              <td class="px-4 py-3 text-sm">
                <span [class]="page.status === 'Published' ? 'badge-published' : 'badge-draft'">{{ page.status }}</span>
              </td>
              <td class="px-4 py-3 text-sm text-slate-500">{{ page.updatedAt | date: 'short' }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
